<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP Servers</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root { color-scheme:light; --bg:#fff; --fg:#1d1d1f; --mut:#6b6b70; --line:#dcdce0; --card:#f6f6f8; --acc:#d97757; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#1c1c1e; --fg:#f2f2f4; --mut:#9a9aa0; --line:#3a3a3e; --card:#262629; --err:#ff6b5b; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#1c1c1e; --fg:#f2f2f4; --mut:#9a9aa0; --line:#3a3a3e; --card:#262629; --err:#ff6b5b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { color:var(--err); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; min-width:0; }
  .name { font-weight:600; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 6px; color:var(--mut); margin-left:6px; }
  .sub { color:var(--mut); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profiles { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .profiles label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  #banner { display:none; background:#c0392b; color:#fff; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
  .warn { color:var(--err); font-size:12px; }
  dialog { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:10px; width:min(560px,94vw); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .f { margin-bottom:12px; }
  .f > label { display:block; font-size:12px; color:var(--mut); margin-bottom:3px; }
  input, select, textarea { width:100%; font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  textarea { font-family:ui-monospace,Consolas,monospace; min-height:64px; }
  .kv { display:flex; gap:6px; margin-bottom:6px; }
  .kv input:first-child { flex:0 0 38%; font-family:ui-monospace,Consolas,monospace; }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .empty { color:var(--mut); text-align:center; padding:32px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>MCP Servers</h1>
    <div class="row">
      <select id="imp-profile" title="Copy this profile's MCP servers into the shared list" style="width:auto"></select>
      <button id="imp">Import</button>
      <button id="theme" title="Theme: auto, light or dark"></button>
      <button class="primary" id="add">+ Add server</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="f"><label>Name</label><input id="f-name" required pattern="[A-Za-z0-9_\-]+" placeholder="my-server"></div>
    <div class="f"><label>Type</label>
      <select id="f-type"><option value="stdio">stdio (local command)</option><option value="http">http (remote URL)</option></select>
    </div>
    <div id="stdio">
      <div class="f"><label>Command</label><input id="f-command" placeholder="npx"></div>
      <div class="f"><label>Arguments (one per line)</label><textarea id="f-args" placeholder="-y&#10;@modelcontextprotocol/server-filesystem"></textarea></div>
      <div class="f"><label>Environment variables</label><div id="env"></div><button type="button" data-add="env">+ Add variable</button></div>
    </div>
    <div id="http">
      <div class="f"><label>URL</label><input id="f-url" placeholder="https://example.com/mcp"></div>
      <div class="f"><label>Headers</label><div id="headers"></div><button type="button" data-add="headers">+ Add header</button></div>
    </div>
    <div class="warn" id="err"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
let state = { servers: [], profiles: [] };
let editing = null; // original name when editing, null when creating
const $ = id => document.getElementById(id);

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function banner(msg) {
  const b = $('banner');
  b.textContent = msg || '';
  b.style.display = msg ? 'block' : 'none';
}

async function load() {
  try { state = await api('/api/state'); banner(''); }
  catch (e) { banner(e.message); }
  render();
}

function summary(s) {
  return s.type === 'http' ? s.url : [s.command, ...s.args].join(' ');
}

function render() {
  const list = $('list');
  list.replaceChildren();
  const sel = $('imp-profile');
  const cur = sel.value;
  sel.replaceChildren(...state.profiles.map(p => el('option', { value: p.name, textContent: 'from ' + p.name })));
  if (state.profiles.some(p => p.name === cur)) sel.value = cur;
  if (!state.servers.length) list.append(el('div', { className: 'empty', textContent: 'No MCP servers yet.' }));
  for (const s of state.servers) {
    const checks = state.profiles.map(p => {
      const cb = el('input', { type: 'checkbox', checked: p.enabled.includes(s.name), disabled: !!p.error });
      cb.style.width = 'auto';
      cb.onchange = async () => {
        try { await api('/api/toggle', { profile: p.name, server: s.name, on: cb.checked }); }
        catch (e) { banner(e.message); }
        load();
      };
      return el('label', { title: p.error || p.dir }, cb, p.name);
    });
    const del = el('button', { className: 'danger', textContent: 'Delete' });
    del.onclick = async () => {
      if (!confirm(`Delete "${s.name}" and remove it from every profile?`)) return;
      try { await api('/api/delete', { name: s.name }); } catch (e) { banner(e.message); }
      load();
    };
    const edit = el('button', { textContent: 'Edit' });
    edit.onclick = () => openDialog(s);
    list.append(el('div', { className: 'card' },
      el('div', { className: 'row' },
        el('div', { className: 'grow' },
          el('div', {}, el('span', { className: 'name', textContent: s.name }), el('span', { className: 'tag', textContent: s.type })),
          el('div', { className: 'sub', textContent: summary(s), title: summary(s) })),
        edit, del),
      el('div', { className: 'profiles' }, ...checks)));
  }
  for (const p of state.profiles.filter(p => p.error))
    list.append(el('div', { className: 'warn', textContent: `${p.name}: ${p.error}` }));
}

function kvRow(container, k = '', v = '') {
  const row = el('div', { className: 'kv' },
    el('input', { placeholder: 'NAME', value: k }),
    el('input', { placeholder: 'value', value: v }),
    el('button', { type: 'button', textContent: '×', onclick: () => row.remove() }));
  $(container).append(row);
}

function readKv(container) {
  const out = {};
  for (const row of $(container).children) {
    const [k, v] = row.querySelectorAll('input');
    if (k.value.trim()) out[k.value.trim()] = v.value;
  }
  return out;
}

function syncType() {
  const http = $('f-type').value === 'http';
  $('stdio').style.display = http ? 'none' : '';
  $('http').style.display = http ? '' : 'none';
}

function openDialog(s) {
  editing = s ? s.name : null;
  $('err').textContent = '';
  $('f-name').value = s ? s.name : '';
  $('f-type').value = s ? s.type : 'stdio';
  $('f-command').value = s ? s.command : '';
  $('f-args').value = s ? s.args.join('\n') : '';
  $('f-url').value = s ? s.url : '';
  for (const c of ['env', 'headers']) $(c).replaceChildren();
  for (const [k, v] of Object.entries(s ? s.env : {})) kvRow('env', k, v);
  for (const [k, v] of Object.entries(s ? s.headers : {})) kvRow('headers', k, v);
  syncType();
  $('dlg').showModal();
}

const themes = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Auto';
}
let theme = 'auto';
try { theme = localStorage.getItem('theme') || 'auto'; } catch {}
applyTheme(theme);
$('theme').onclick = () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { theme === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', theme); } catch {}
  applyTheme(theme);
};
$('add').onclick = () => openDialog(null);
$('imp').onclick = async () => {
  try {
    const r = await api('/api/import', { profile: $('imp-profile').value });
    banner(r.added.length ? '' : 'Nothing new to import.');
    if (!r.added.length) setTimeout(() => banner(''), 3000);
  } catch (e) { banner(e.message); }
  load();
};
$('cancel').onclick = () => $('dlg').close();
$('f-type').onchange = syncType;
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => kvRow(b.dataset.add));

$('form').onsubmit = async e => {
  e.preventDefault();
  const http = $('f-type').value === 'http';
  const server = {
    name: $('f-name').value.trim(),
    type: http ? 'http' : 'stdio',
    command: http ? '' : $('f-command').value.trim(),
    args: http ? [] : $('f-args').value.split('\n').map(a => a.trim()).filter(Boolean),
    env: http ? {} : readKv('env'),
    url: http ? $('f-url').value.trim() : '',
    headers: http ? readKv('headers') : {},
    extra: editing ? (state.servers.find(s => s.name === editing)?.extra || {}) : {},
  };
  try {
    await api('/api/server', { original: editing, server });
    $('dlg').close();
    load();
  } catch (err) { $('err').textContent = err.message; }
};

load();
</script>
</body>
</html>
