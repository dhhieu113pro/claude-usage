<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Rings – Profiles</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main>
  <header>
    <nav id="nav"></nav>
    <div class="row">
      <button id="theme" class="icon"></button>
      <button id="add-existing" title="Show an existing Claude config folder in the widget">Add existing…</button>
      <button class="primary" id="new-profile">+ New profile</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="list"></div>
</main>

<dialog id="edlg">
  <form method="dialog" id="eform">
    <div class="f"><label>Name (shown under the rings)</label><input id="e-name" required></div>
    <div class="f"><label>Launcher command</label><input id="e-command" placeholder="claude-work">
      <div class="sub wrap">The profile's <code>.cmd</code> on PATH; it is read for <code>CLAUDE_CONFIG_DIR</code>.</div></div>
    <div class="f"><label>Config folder (takes priority over the command)</label><input id="e-dir" placeholder="C:\Users\you\claude-profiles\claude-work">
      <div class="sub wrap">Leave both empty to use <code>~/.claude</code>.</div></div>
    <div class="warn" id="e-err"></div>
    <div class="actions">
      <button type="button" id="e-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="pdlg">
  <form method="dialog" id="pform">
    <div class="f"><label>Profile name</label><input id="p-name" required pattern="[A-Za-z0-9_.\-]+" placeholder="claude-work"></div>
    <div class="f"><label>Turn on these MCP servers</label><div id="p-servers"></div></div>
    <div class="sub wrap">Creates the config folder and a launcher command (type the profile name in a new terminal), and adds the profile to the widget.</div>
    <div class="warn" id="p-err"></div>
    <div id="p-result" class="sub wrap" style="white-space:pre-wrap"></div>
    <div class="actions">
      <button type="button" id="p-cancel">Close</button>
      <button type="submit" class="primary" id="p-create">Create</button>
    </div>
  </form>
</dialog>

<script src="/ui.js"></script>
<script>
let cfg = { refresh_seconds: 900, profiles: [] };
let state = { servers: [], profiles: [] };
let editing = null; // original name when editing, null when adding

async function load() {
  try {
    [cfg, state] = await Promise.all([api('/api/config'), api('/api/state')]);
    banner('');
  } catch (e) { banner(e.message); }
  render();
}

// Saves the profile list; the config is re-read first so other changes are kept.
async function saveProfiles(change) {
  const fresh = await api('/api/config');
  fresh.profiles = change(fresh.profiles);
  await api('/api/config', fresh);
}

function render() {
  const list = $('list');
  list.replaceChildren();
  if (!cfg.profiles.length) list.append(el('div', { className: 'empty', textContent: 'No profiles yet.' }));
  for (const p of cfg.profiles) {
    const info = state.profiles.find(x => x.name === p.name) || { enabled: [], dir: '' };
    const how = p.config_dir ? `folder: ${p.config_dir}` : p.command ? `command: ${p.command}` : 'default (~/.claude)';
    const edit = el('button', { textContent: 'Edit', onclick: () => openEdit(p) });
    const del = el('button', {
      className: 'danger', textContent: 'Remove', title: 'Hide in the widget; files are kept',
      onclick: async () => {
        if (!confirm(`Remove "${p.name}" from the widget? Its files are kept.`)) return;
        try { await saveProfiles(ps => ps.filter(x => x.name !== p.name)); } catch (e) { banner(e.message); }
        load();
      },
    });
    const tags = info.enabled.length
      ? info.enabled.map(n => el('span', { className: 'tag', textContent: n }))
      : [el('span', { className: 'sub', textContent: 'no MCP servers' })];
    list.append(el('div', { className: 'card' },
      el('div', { className: 'row' },
        el('div', { className: 'grow' },
          el('div', { className: 'name', textContent: p.name }),
          el('div', { className: 'sub', textContent: how, title: how }),
          el('div', { className: 'sub', textContent: info.dir, title: info.dir })),
        edit, del),
      info.error ? el('div', { className: 'warn', textContent: info.error }) : '',
      el('div', { className: 'profiles' }, ...tags)));
  }
}

function openEdit(p) {
  editing = p ? p.name : null;
  $('e-err').textContent = '';
  $('e-name').value = p ? p.name : '';
  $('e-command').value = p?.command || '';
  $('e-dir').value = p?.config_dir || '';
  $('edlg').showModal();
}

$('add-existing').onclick = () => openEdit(null);
$('e-cancel').onclick = () => $('edlg').close();
$('eform').onsubmit = async e => {
  e.preventDefault();
  const entry = {
    name: $('e-name').value.trim(),
    command: $('e-command').value.trim() || null,
    config_dir: $('e-dir').value.trim() || null,
  };
  try {
    await saveProfiles(ps => editing === null ? [...ps, entry] : ps.map(x => x.name === editing ? entry : x));
    $('edlg').close();
    load();
  } catch (err) { $('e-err').textContent = err.message; }
};

$('new-profile').onclick = () => {
  $('p-name').value = '';
  $('p-err').textContent = '';
  $('p-result').textContent = '';
  $('p-create').disabled = false;
  $('p-servers').replaceChildren(...state.servers.map(s =>
    el('label', { style: 'display:flex;gap:6px;align-items:center;margin-bottom:4px' }, el('input', { type: 'checkbox', value: s.name }), s.name)));
  if (!state.servers.length) $('p-servers').append(el('div', { className: 'sub', textContent: 'No shared MCP servers yet.' }));
  $('pdlg').showModal();
};
$('p-cancel').onclick = () => $('pdlg').close();
$('pform').onsubmit = async e => {
  e.preventDefault();
  $('p-err').textContent = '';
  const servers = [...$('p-servers').querySelectorAll('input:checked')].map(c => c.value);
  try {
    const r = await api('/api/profile', { name: $('p-name').value.trim(), servers });
    $('p-result').textContent = [`Created ${r.dir}`, `Run: ${r.launcher}`, ...r.notes].join('\n');
    $('p-create').disabled = true;
    load();
  } catch (err) { $('p-err').textContent = err.message; }
};

load();
</script>
</body>
</html>
