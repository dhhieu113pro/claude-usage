<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Rings – Settings</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main>
  <header>
    <nav id="nav"></nav>
    <button id="theme" class="icon"></button>
  </header>
  <div id="banner"></div>

  <form id="sform">
    <section class="card">
      <h2>Refresh</h2>
      <div class="f" style="max-width:260px"><label>Refresh every (seconds, minimum 15)</label>
        <input id="s-refresh" type="number" min="15" step="1" required></div>
      <div class="sub wrap">How often usage is polled. The old numbers stay visible while a refresh runs.</div>
    </section>

    <div class="actions">
      <span class="warn" id="s-err"></span><span class="ok" id="s-ok"></span>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</main>

<script src="/ui.js"></script>
<script>
let cfg = { refresh_seconds: 900, profiles: [] };

async function load() {
  try {
    cfg = await api('/api/config');
    $('s-refresh').value = cfg.refresh_seconds;
    banner('');
  } catch (e) { banner(e.message); }
}

$('sform').onsubmit = async e => {
  e.preventDefault();
  $('s-err').textContent = '';
  $('s-ok').textContent = '';
  try {
    // Re-read first so profile changes made on the Profiles page are not overwritten.
    const fresh = await api('/api/config');
    await api('/api/config', { ...fresh, refresh_seconds: Number($('s-refresh').value) });
    $('s-ok').textContent = 'Saved';
    setTimeout(() => $('s-ok').textContent = '', 3000);
  } catch (err) { $('s-err').textContent = err.message; }
};

load();
</script>
</body>
</html>
